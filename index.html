<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKDS ARM9 Music Table Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="mask-icon" href="favicons/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <div id="bg-layer"></div>
    <input type="file" id="fileInput" accept=".bin" hidden>
    <div id="container">
        <header>
            <h1>arm9 music table editor</h1>
        </header>
        <div class="controls">
            <button id="btnOpen">Open arm9.bin</button>
            <button id="btnSave" disabled>Save</button>
            <button id="btnHelp">Help</button>
            <button id="btnRepo">Repository</button>
        </div>
        <div id="mainContent" class="hidden">
            <div class="editor-section">
                <label for="trackList">select a track to change the seq value:</label>
                <select id="trackList" size="15"></select>
            </div>
        </div>
    </div>
    <script src="code.js"></script>
</body>
</html>
